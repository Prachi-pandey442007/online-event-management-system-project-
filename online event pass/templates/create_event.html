<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Event | EventPass</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin">EventPass Admin</a>
            <a class="btn btn-outline-light" href="/admin">Back to Dashboard</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-4">Create New Event</h1>

                <form method="POST" action="/admin/events/create">
                    <div class="mb-3">
                        <label class="form-label">Event Title</label>
                        <input class="form-control" type="text" name="title" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="4"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Event Date</label>
                            <input class="form-control" type="date" name="event_date" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Venue</label>
                            <input class="form-control" type="text" name="venue" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Start Time</label>
                            <input class="form-control" type="time" name="start_time" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">End Time</label>
                            <input class="form-control" type="time" name="end_time">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Capacity</label>
                            <input class="form-control" type="number" name="capacity" min="1" required>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100" type="submit">
                        Create Event
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
